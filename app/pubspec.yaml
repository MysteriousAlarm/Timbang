name: timbang
description: "TIMBANG: verified daily vegetable prices and produce listings for Nueva Vizcaya."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  excel: ^4.0.6
  file_picker: ^13.3.2
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Text and UI: IBM Plex Sans (SIL OFL). Has the peso sign and full Filipino coverage.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Prices and data labels: IBM Plex Mono, like the readout of a weighing scale.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    # Headlines and the wordmark: Fraunces, static instances (opsz 36, SOFT 50).
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/timbang_icon.png"
  web:
    generate: true
    image_path: "assets/images/timbang_icon.png"
    background_color: "#138A36"
    theme_color: "#138A36"